[www]
listen = 127.0.0.1:9000
; Small demo-sized pool; raise on a bigger instance.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Keep real environment variables visible to PHP (the platform sets them).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
